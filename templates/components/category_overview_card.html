<!-- Category Overview Card Component -->
<a href="{{ url_for('gitmem.hub_context_category', ws_slug=workspace.slug if workspace else 'default', category=category_id) }}" class="group block">
    <div class="h-full bg-[var(--mc-surface)] hover:bg-[var(--mc-surface-2)] border border-mc-border hover:border-{{ color_class|default('mc-primary') }}/50 rounded-2xl p-6 transition-all duration-300 relative overflow-hidden flex flex-col">
        <!-- Background Glow -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-{{ color_class|default('mc-primary') }}/5 rounded-full blur-2xl group-hover:bg-{{ color_class|default('mc-primary') }}/10 transition-all"></div>
        
        <div class="flex items-start justify-between mb-4 relative z-10">
            <div class="w-10 h-10 rounded-xl bg-{{ color_class|default('mc-primary') }}/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                <i data-lucide="{{ icon }}" class="w-5 h-5 text-{{ color_class|default('mc-primary') }}"></i>
            </div>
            <i data-lucide="arrow-up-right" class="w-4 h-4 text-gray-500 group-hover:text-white opacity-0 group-hover:opacity-100 transition-all transform translate-y-1 -translate-x-1 group-hover:translate-y-0 group-hover:translate-x-0"></i>
        </div>
        
        <div class="relative z-10 flex-1">
            <h3 class="text-base font-bold text-white mb-1 group-hover:text-{{ color_class|default('mc-primary') }} transition-colors">{{ title }}</h3>
            <p class="text-[13px] text-gray-400 mb-4">{{ description }}</p>
        </div>
        
        <div class="relative z-10 pt-4 border-t border-mc-border flex justify-between items-center mt-auto">
            <span class="text-xs font-mono text-white bg-black/30 px-2.5 py-1 rounded-md">{{ count }} items</span>
            <span class="text-[11px] text-gray-500">{{ last_updated }}</span>
        </div>
    </div>
</a>
